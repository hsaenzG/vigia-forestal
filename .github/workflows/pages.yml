# Publica el frontend en GitHub Pages. Los datos y el agente siguen en AWS:
# el sitio lee data/*.json de CloudFront y llama a POST /analyze en API Gateway.
name: Publicar frontend en GitHub Pages

on:
  push:
    branches: [main]
    paths: ["frontend/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  # URLs públicas del backend desplegado con `make deploy` (salidas ApiUrl y SiteUrl del stack)
  API_URL: https://j4kbh3v5fh.execute-api.us-east-2.amazonaws.com
  DATA_URL: https://dqj62khtkxqf7.cloudfront.net/data

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Configurar el frontend para el backend en AWS
        run: |
          printf 'window.VIGIA_CONFIG = {"apiUrl": "%s", "dataUrl": "%s", "mode": "pages"};\n' \
            "$API_URL" "$DATA_URL" > frontend/config.js
          touch frontend/.nojekyll
      - uses: actions/configure-pages@v6.0.0
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: frontend
      - id: deployment
        uses: actions/deploy-pages@v5.0.1
